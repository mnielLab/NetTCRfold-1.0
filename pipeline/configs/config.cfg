##Step selection:
RUN_JSON_WITH_MSA_TEMPLATE_GENERATION=true
RUN_DATA_GENERATION_PIPELINE=true
RUN_CUSTOM_JSON_GENERATION=true
RUN_AF3_INFERENCE=true
COMPUTE_DOCKQ=true
RUN_METRICS_COLLECTION=true

##Slurm array variables (optional, default 1 if not set)
CONCURRENT=40 #Max concurrent array tasks for RUN_DATA_GENERATION_PIPELINE
CONCURRENT_INFERENCE=2 #Max concurrent array tasks for RUN_AF3_INFERENCE

##Which array index to start submitting from (optional, default 1)
GLOBAL_START=1

##Preprocessing step
DATA_DIR="/path/to/your/project/data/" #Holds both the input csv and all pipeline outputs for this run
INPUT_FILE="single_target.csv"
SUFFIX_DATAGEN="" #Optional. Suffix to append to the datafolder, e.g. when running multiple settings for the same input

##AF3 data generation step
#Space-separated list of template selection methods to run (onquery, standard).
TEMPLATE_SELECTION_METHOD="onquery"

##Custom JSON generation step
#Space-separated list of <msaMode>_<templateMode> combinations to reconstruct.
#msaMode: unpairedMSA (null pairedMsa only), pairedMSA (null unpairedMsa only), fullMSA (null nothing), noMSA (null both)
#templateMode: onquery, standard, no (any available folder, templates nulled)
MSA_TEMPLATE_COMBINATIONS="unpaired_onquery"

##AF3 structure inference step
FOLDERS_INFERENCE="json_unpairedMSA_onqueryTemplate" #Optional. Space-separated list of folders to run inference on. If not set, all folders are processed
SUFFIX_OUTPUT="_1seeds_5diffusion" #Optional. Suffix to append to the inference output folder
NUM_SEEDS=1
NUM_DIFFUSION=5

##DockQ computation: required only if COMPUTE_DOCKQ=true
TEMPLATE_PATH="/path/to/solved_structures/"

##Collect metrics
FOLDERS_METRIC_COLLECTION="json_unpairedMSA_onqueryTemplate" #Optional. If not set, all folders are processed
NUM_METRIC_SPLITS=1 #Number of parallel SLURM array tasks to split metrics collection into
CONCURRENT_METRICS=1 #Max concurrent tasks from NUM_METRIC_SPLITS
